<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | TravelX</title>
    <style>
         *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
    }

    body{
    background:#f5f5f5;
    color:#333;
    line-height:1.6;
   }

    header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#0b7285;
   }
      .logo{
    color:#fff;
    font-size:30px;
    font-weight:bold;
    }

    nav ul{
    display:flex;
    list-style:none;
    }

    nav ul li{
    margin-left:25px;
    }

    nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:500;
    transition:.3s;
   }

    nav ul li a:hover,{
    color:#ffd43b;
    }
   .contact-container{
    display: flex;
    gap: 30px;
    margin-top: 30px;
   }
   .contact-info
   .contact-form{
    flex: 1;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
   }
   .contact-form input
   .contact-form textarea{
   width: 100%;
   padding: 12px;
   margin: 10px;
   border: 1px solid #ccc;
   border-radius: 5px;
   }
   .contact-form button{
    background:#0b7285;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 5px;
    cursor: pointer;
   }
   .contact-form button:hover{
    background: #087f5b;
   }
   .map img{
    width: 90%;
    display: block;
    margin: 40px;
    border-radius: 10px;
   }

   footer{
    background: #0b7285;
    color: white;
    text-align: center;
    padding: 20px;
   }
@media(max-width:768px){

    header{
        flex-direction: column;
    }
    nav ul{
        flex-direction: column;
        text-align: center;
        margin-top: 15px;
    }
    nav ul li{
        margin: 10px;
    }
    .hero{
        height: 60vh;
    }
    .hero h1{
        font-size: 35px;
    }
    .features
    .mission-vision
    .contact-container{
        flex-direction: column;
    }
}
@media(max-width:480px){

    .logo{
        font-size: 24px;
    }
    .hero{
        height: 50vh;
    }
    .hero h1{
        font-size: 28px;
    }
    .hero p{
        font-size: 14px;
    }
    .intro
    .about
    .contact{
        width: 95%;
    }
    .card img
    .team-card img{
        height: 200px;
    }
    footer{
        font-size: 14px;
    }
}
    </style>
</head>
<body>
    <header>
        <div class="logo">TravelX</div>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you! Feel free to contact us anytime.</p>

        <div class="contact-container">
            <div class="contact-info">
                <h2>Our Office</h2>
                <p><strong>Address:</strong> Lahore, Pakistan</p>
                <p><strong>Phone:</strong> +92 300 1234567</p>
                <p><strong>Email:</strong> info@travelx.com</p>
                <p><strong>Working Hours:</strong> Mon - Sat (9:00 AM - 6:00 PM)</p>
            </div>
            <br>
            <div class="contact-form">
                <form>
                    <input type="text" placeholder="Your Name" required><br>
                    <input type="email" placeholder="Your Email" required><br>
                    <input type="text" placeholder="Subject" required><br>
                    <textarea rows="6" placeholder="Your Message"></textarea><br>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </div>

        <div class="map">
            <img src="images/map.jpg" alt="Google Map Placeholder">
        </div>
    </section>

    <footer>
        <p>&copy; 2026 TravelX. All Rights Reserved.</p>
    </footer>

</body>
</html>
